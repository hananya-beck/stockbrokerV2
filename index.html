<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>StockBroker</title>
<link rel="stylesheet" href="src/styles/tokens.css" />
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-family-base);
    padding: var(--space-6);
  }
  .wrap { max-width: var(--max-width); margin: 0 auto; }
  .top-row { display: flex; justify-content: space-between; align-items: flex-start; gap: var(--space-5); }
  h1 { font-size: var(--font-size-lg); margin: 0 0 var(--space-1); }
  .sub { color: var(--muted); margin: 0 0 var(--space-7); font-size: var(--font-size-base); }
  .lang-switch {
    display: flex;
    gap: var(--space-1);
    border: var(--border-width) solid var(--border);
    border-radius: var(--radius-md);
    padding: 3px;
    background: var(--card);
    flex-shrink: 0;
  }
  .lang-switch button {
    border: none;
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-size: var(--font-size-sm);
    padding: var(--space-2) var(--space-4);
    border-radius: var(--radius-sm);
    cursor: pointer;
  }
  .lang-switch button[aria-pressed="true"] { background: var(--accent); color: var(--card); }
  .card {
    background: var(--card);
    border: var(--border-width) solid var(--border);
    border-radius: var(--radius-lg);
    padding: var(--space-6);
    margin-bottom: var(--space-6);
  }
  .amount-row {
    display: flex;
    gap: var(--space-4);
    align-items: center;
    flex-wrap: wrap;
  }
  .amount-row label { font-weight: 600; }
  .amount-row input {
    font-size: var(--font-size-md);
    padding: var(--space-3) var(--space-5);
    border-radius: var(--radius-md);
    border: var(--border-width) solid var(--border);
    background: var(--bg);
    color: var(--text);
    width: var(--input-width);
  }
  .table-scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: var(--font-size-base); }
  th, td { padding: var(--space-3) var(--space-2); text-align: start; border-bottom: var(--border-width) solid var(--border); }
  th { color: var(--muted); font-weight: 600; font-size: var(--font-size-sm); }
  .col-sort {
    display: inline-flex;
    align-items: center;
    gap: var(--space-1);
    background: none;
    border: none;
    color: inherit;
    font: inherit;
    font-weight: inherit;
    cursor: pointer;
    padding: 0;
  }
  .sort-indicator { font-size: var(--font-size-xs); min-width: 1em; display: inline-block; }
  .pos { color: var(--good); }
  .neg { color: var(--bad); }
  .na { color: var(--muted); }
  .weight-bar-wrap {
    background: var(--border);
    border-radius: var(--radius-sm);
    height: var(--weight-bar-height);
    overflow: hidden;
    width: 100%;
    min-width: var(--weight-bar-min-width);
  }
  .weight-bar {
    background: var(--accent);
    height: 100%;
  }
  .fund-name { font-weight: 600; }
  .fund-sub { color: var(--muted); font-size: var(--font-size-xs); }
  .nis { font-weight: 700; }
  footer { color: var(--muted); font-size: var(--font-size-xs); margin-top: var(--space-8); line-height: var(--line-height-relaxed); }
  .summary td { font-weight: 700; border-top: 2px solid var(--border); padding-top: var(--space-4); }
  .updated { color: var(--muted); font-size: var(--font-size-sm); }
  .schedule-note { margin: var(--space-3) 0 0; }
  .refresh-btn {
    font: inherit;
    padding: var(--space-3) var(--space-5);
    border-radius: var(--radius-md);
    border: var(--border-width) solid var(--accent);
    background: var(--accent);
    color: var(--card);
    cursor: pointer;
  }
  .refresh-btn:disabled { opacity: 0.6; cursor: not-allowed; }
  .refresh-status { display: inline-flex; align-items: center; gap: var(--space-2); color: var(--muted); font-size: var(--font-size-sm); }
  .refresh-status.error { color: var(--bad); }
  .spinner {
    width: var(--font-size-base);
    height: var(--font-size-base);
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  .spinner[hidden] { display: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="wrap">
  <div class="top-row">
    <div>
      <h1 id="heading"></h1>
      <p class="sub" id="subheading"></p>
    </div>
    <div class="lang-switch" role="group" aria-label="Language / שפה">
      <button type="button" data-lang="he" aria-pressed="true">עברית</button>
      <button type="button" data-lang="en" aria-pressed="false">English</button>
    </div>
  </div>

  <div class="card">
    <div class="amount-row">
      <label for="amount" id="amountLabel"></label>
      <input id="amount" type="number" value="1000" min="0" step="50" />
      <span class="updated" id="updated"></span>
      <button type="button" class="refresh-btn" id="refreshBtn"></button>
      <span class="refresh-status" id="refreshStatus" role="status" aria-live="polite">
        <span class="spinner" id="refreshSpinner" hidden></span>
        <span id="refreshText"></span>
      </span>
    </div>
    <p class="updated schedule-note" id="scheduleNote"></p>
  </div>

  <div class="card">
    <div class="table-scroll">
      <table id="fundsTable">
        <thead>
          <tr>
            <th><button type="button" class="col-sort" data-sort="colFund"><span id="colFund"></span><span class="sort-indicator" data-sort-indicator="colFund"></span></button></th>
            <th><button type="button" class="col-sort" data-sort="colId"><span id="colId"></span><span class="sort-indicator" data-sort-indicator="colId"></span></button></th>
            <th><button type="button" class="col-sort" data-sort="col1m"><span id="col1m"></span><span class="sort-indicator" data-sort-indicator="col1m"></span></button></th>
            <th><button type="button" class="col-sort" data-sort="col3m"><span id="col3m"></span><span class="sort-indicator" data-sort-indicator="col3m"></span></button></th>
            <th><button type="button" class="col-sort" data-sort="col1y"><span id="col1y"></span><span class="sort-indicator" data-sort-indicator="col1y"></span></button></th>
            <th><button type="button" class="col-sort" data-sort="col3y"><span id="col3y"></span><span class="sort-indicator" data-sort-indicator="col3y"></span></button></th>
            <th><button type="button" class="col-sort" data-sort="col5y"><span id="col5y"></span><span class="sort-indicator" data-sort-indicator="col5y"></span></button></th>
            <th><button type="button" class="col-sort" data-sort="colVol1y"><span id="colVol1y"></span><span class="sort-indicator" data-sort-indicator="colVol1y"></span></button></th>
            <th><button type="button" class="col-sort" data-sort="colVol3y"><span id="colVol3y"></span><span class="sort-indicator" data-sort-indicator="colVol3y"></span></button></th>
            <th><button type="button" class="col-sort" data-sort="colVol5y"><span id="colVol5y"></span><span class="sort-indicator" data-sort-indicator="colVol5y"></span></button></th>
            <th><button type="button" class="col-sort" data-sort="colVolBlended"><span id="colVolBlended"></span><span class="sort-indicator" data-sort-indicator="colVolBlended"></span></button></th>
            <th><button type="button" class="col-sort" data-sort="colScore"><span id="colScore"></span><span class="sort-indicator" data-sort-indicator="colScore"></span></button></th>
            <th><button type="button" class="col-sort" data-sort="colWeight"><span id="colWeight"></span><span class="sort-indicator" data-sort-indicator="colWeight"></span></button></th>
            <th><button type="button" class="col-sort" data-sort="colAmount"><span id="colAmount"></span><span class="sort-indicator" data-sort-indicator="colAmount"></span></button></th>
          </tr>
        </thead>
        <tbody id="fundsBody"></tbody>
        <tfoot>
          <tr class="summary"><td colspan="14" id="fundsSummary"></td></tr>
        </tfoot>
      </table>
    </div>
  </div>

  <dialog id="tokenDialog" class="card">
    <form method="dialog">
      <p><label for="tokenInput" id="tokenLabel"></label></p>
      <p><input id="tokenInput" type="password" autocomplete="off" dir="ltr" /></p>
      <button value="ok" class="refresh-btn" id="tokenConfirm"></button>
      <button value="cancel" formnovalidate id="tokenCancel"></button>
    </form>
  </dialog>

  <footer>
    <p><strong id="disclaimerBold"></strong> <span id="disclaimerBody"></span></p>
  </footer>
</div>

<script type="module">
import { buildFundRowViewModel, formatRelativeTime, summarizeAllocation } from './src/lib/formatting.js';
import { describeApiError, describeRunState, dispatchedRunId, dispatchedRunsQuery, isPastDeadline, pickDispatchedRun } from './src/lib/refresh.js';
import { DIRECTION, LOCALE, resolveLang, t, withLang } from './src/lib/i18n.js';

/** @type {import('./src/lib/i18n.js').Lang} */
let lang = resolveLang(location.search);

/** @param {import('./src/lib/formatting.js').FormattedValue} v */
function cell(v) {
  if (v.sign) return `<span class="${v.sign}">${v.text}</span>`;
  if (v.text === '—') return `<span class="na">${v.text}</span>`;
  return v.text;
}

const tbody = document.getElementById('fundsBody');
const amountInput = /** @type {HTMLInputElement} */ (document.getElementById('amount'));
let data = null;

// Weight and amount sort the same way for a fixed deposit, so colAmount reuses colWeight's accessor.
const SORT_ACCESSORS = {
  colFund: f => lang === 'he' ? f.name_he : f.name_en,
  colId: f => f.id,
  col1m: f => f.metrics.return_1m,
  col3m: f => f.metrics.return_3m,
  col1y: f => f.metrics.return_1y,
  col3y: f => f.metrics.return_3y,
  col5y: f => f.metrics.return_5y,
  colVol1y: f => f.metrics.volatility_1y,
  colVol3y: f => f.metrics.volatility_3y,
  colVol5y: f => f.metrics.volatility_5y,
  colVolBlended: f => f.metrics.volatility_blended,
  colScore: f => f.metrics.risk_adjusted_score,
  colWeight: f => f.suggested_weight,
  colAmount: f => f.suggested_weight,
};

let sortState = { key: null, dir: 1 };

function sortedFunds() {
  if (!data) return [];
  const accessor = sortState.key && SORT_ACCESSORS[sortState.key];
  if (!accessor) return data.funds;
  return data.funds
    .map((f, i) => ({ f, i }))
    .sort((a, b) => {
      const av = accessor(a.f);
      const bv = accessor(b.f);
      const aNull = av === null || av === undefined;
      const bNull = bv === null || bv === undefined;
      if (aNull || bNull) return aNull === bNull ? a.i - b.i : aNull ? 1 : -1;
      const cmp = typeof av === 'string' ? av.localeCompare(bv) : av - bv;
      return (cmp || a.i - b.i) * sortState.dir;
    })
    .map(x => x.f);
}

function updateSortIndicators() {
  for (const el of document.querySelectorAll('[data-sort-indicator]')) {
    const th = el.closest('th');
    const active = el.dataset.sortIndicator === sortState.key;
    el.textContent = active ? (sortState.dir === 1 ? '▲' : '▼') : '';
    if (th) th.setAttribute('aria-sort', active ? (sortState.dir === 1 ? 'ascending' : 'descending') : 'none');
  }
}

for (const btn of document.querySelectorAll('.col-sort')) {
  btn.addEventListener('click', () => {
    const key = /** @type {HTMLElement} */ (btn).dataset.sort;
    sortState = sortState.key === key ? { key, dir: sortState.dir * -1 } : { key, dir: 1 };
    updateSortIndicators();
    render();
  });
}

function applyStaticText() {
  document.documentElement.lang = lang;
  document.documentElement.dir = DIRECTION[lang];
  document.title = t(lang, 'title');
  for (const id of [
    'heading', 'subheading', 'amountLabel', 'refreshButton', 'scheduleNote',
    'colFund', 'colId', 'col1m', 'col3m', 'col1y', 'col3y', 'col5y',
    'colVol1y', 'colVol3y', 'colVol5y', 'colVolBlended', 'colScore', 'colWeight', 'colAmount',
    'tokenLabel', 'tokenConfirm', 'tokenCancel', 'disclaimerBold', 'disclaimerBody',
  ]) {
    const el = document.getElementById(id);
    if (el) el.textContent = t(lang, id);
  }
  document.getElementById('refreshBtn').textContent = t(lang, 'refreshButton');
  for (const btn of document.querySelectorAll('.lang-switch button')) {
    btn.setAttribute('aria-pressed', String(/** @type {HTMLElement} */ (btn).dataset.lang === lang));
  }
}

function setLang(newLang) {
  lang = newLang;
  history.replaceState(null, '', withLang(location.search, lang));
  applyStaticText();
  if (data) showData(data);
}

for (const btn of document.querySelectorAll('.lang-switch button')) {
  btn.addEventListener('click', () => setLang(/** @type {HTMLElement} */ (btn).dataset.lang));
}

function showData(newData) {
  data = newData;
  document.getElementById('updated').textContent =
    t(lang, 'updatedPrefix') + new Date(data.generated_at).toLocaleString(LOCALE[lang]) +
    ' (' + formatRelativeTime(data.generated_at, new Date(), lang) + ')';
  render();
}

/** @param {string} s */
function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
}

function render() {
  if (!data) return;
  const amount = parseFloat(amountInput.value) || 0;
  tbody.innerHTML = '';
  for (const f of sortedFunds()) {
    const row = buildFundRowViewModel(f, amount);
    const primaryName = lang === 'he' ? row.nameHe : row.nameEn;
    const secondaryName = lang === 'he' ? row.nameEn : row.nameHe;
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>
        <div class="fund-name">${escapeHtml(primaryName)}</div>
        <div class="fund-sub">${escapeHtml(secondaryName)}</div>
      </td>
      <td>${escapeHtml(String(row.id))}</td>
      <td>${cell(row.return1m)}</td>
      <td>${cell(row.return3m)}</td>
      <td>${cell(row.return1y)}</td>
      <td>${cell(row.return3y)}</td>
      <td>${cell(row.return5y)}</td>
      <td>${cell(row.volatility1y)}</td>
      <td>${cell(row.volatility3y)}</td>
      <td>${cell(row.volatility5y)}</td>
      <td>${cell(row.volatilityBlended)}</td>
      <td>${cell(row.riskAdjustedScore)}</td>
      <td>
        <div class="weight-bar-wrap"><div class="weight-bar" style="width:${row.weightPct}%"></div></div>
        ${row.weightPct}%
      </td>
      <td class="nis">₪${row.amount.toLocaleString(LOCALE[lang])}</td>
    `;
    tbody.appendChild(tr);
  }
  const s = summarizeAllocation(data.funds, amount);
  document.getElementById('fundsSummary').textContent =
    `${t(lang, 'summaryTotal')}: ₪${s.totalAmount.toLocaleString(LOCALE[lang])} · ${s.fundCount} ${t(lang, 'summaryFunds')} · ${t(lang, 'summaryScore')}: ${s.weightedScore.text}`;
}

amountInput.addEventListener('input', render);

applyStaticText();
updateSortIndicators();

async function load() {
  const res = await fetch('data/funds.json', { cache: 'no-store' });
  if (!res.ok) throw new Error(t(lang, 'fileLoadError').replace('{status}', String(res.status)));
  showData(await res.json());
}

load().catch(err => {
  const message = `${t(lang, 'dataLoadErrorPrefix')}${err.message}`;
  const td = document.createElement('td');
  td.colSpan = 14;
  td.textContent = message;
  const tr = document.createElement('tr');
  tr.appendChild(td);
  tbody.replaceChildren(tr);
  setStatus(message, { error: true });
});

// ---- On-demand refresh: dispatch the workflow, wait for it, reload data ----
const REPO = 'hananya-beck/stockbroker';
const WORKFLOW = 'update-data.yml';
const API = `https://api.github.com/repos/${REPO}`;
const POLL_MS = 5000;
const TIMEOUT_MS = 15 * 60 * 1000;

// Kept in memory for this tab only — never written to storage.
let token = null;

const refreshBtn = /** @type {HTMLButtonElement} */ (document.getElementById('refreshBtn'));
const refreshStatus = document.getElementById('refreshStatus');
const refreshSpinner = document.getElementById('refreshSpinner');
const refreshText = document.getElementById('refreshText');

function setStatus(message, { busy = false, error = false } = {}) {
  refreshSpinner.hidden = !busy;
  refreshStatus.classList.toggle('error', error);
  refreshText.textContent = message;
}

async function gh(path, init = {}) {
  const res = await fetch(`${API}${path}`, {
    ...init,
    cache: 'no-store',
    headers: {
      Accept: 'application/vnd.github+json',
      Authorization: `Bearer ${token}`,
      'X-GitHub-Api-Version': '2022-11-28',
      ...init.headers,
    },
  });
  if (!res.ok) {
    const message = describeApiError(res.status, lang);
    if (res.status === 401) {
      token = null; // ask again next click
      alert(message);
    }
    throw new Error(message);
  }
  return res;
}

function askToken() {
  return new Promise(resolve => {
    const dialog = /** @type {HTMLDialogElement} */ (document.getElementById('tokenDialog'));
    const input = /** @type {HTMLInputElement} */ (document.getElementById('tokenInput'));
    input.value = '';
    dialog.returnValue = '';
    dialog.addEventListener('close', () => {
      resolve(dialog.returnValue === 'ok' && input.value.trim() ? input.value.trim() : null);
    }, { once: true });
    dialog.showModal();
  });
}

const sleep = ms => new Promise(r => setTimeout(r, ms));

async function refresh() {
  if (!token) token = await askToken();
  if (!token) {
    setStatus(t(lang, 'refreshCancelledNoToken'), { error: true });
    return;
  }

  refreshBtn.disabled = true;
  try {
    setStatus(describeRunState(null, lang).message, { busy: true });
    const dispatchedAt = new Date();
    // API version 2026-03-10 makes dispatch return the new run's id, so we can
    // poll that exact run instead of guessing it from the run list by time.
    const dispatchRes = await gh(`/actions/workflows/${WORKFLOW}/dispatches`, {
      method: 'POST',
      body: JSON.stringify({ ref: 'main' }),
      headers: { 'X-GitHub-Api-Version': '2026-03-10' },
    });
    const runId = dispatchRes.status === 200 ? dispatchedRunId(await dispatchRes.json()) : null;

    const startedAt = Date.now();
    let state;
    for (;;) {
      if (isPastDeadline(startedAt, Date.now(), TIMEOUT_MS)) throw new Error(t(lang, 'refreshTimeout'));
      await sleep(POLL_MS);
      if (runId) {
        const res = await gh(`/actions/runs/${runId}`);
        state = describeRunState(await res.json(), lang);
      } else {
        const res = await gh(`/actions/workflows/${WORKFLOW}/runs?${dispatchedRunsQuery(dispatchedAt)}`);
        const { workflow_runs } = await res.json();
        state = describeRunState(pickDispatchedRun(workflow_runs, dispatchedAt), lang);
      }
      setStatus(state.message, { busy: true });
      if (state.phase !== 'running') break;
    }
    if (state.phase === 'failed') throw new Error(state.message);

    // Contents API, not the Pages URL: Pages redeploys later and would serve the old file.
    const res = await gh('/contents/data/funds.json?ref=main', {
      headers: { Accept: 'application/vnd.github.raw+json' },
    });
    showData(await res.json());
    setStatus('');
  } catch (err) {
    setStatus(err.message, { error: true });
  } finally {
    refreshBtn.disabled = false;
  }
}

refreshBtn.addEventListener('click', refresh);
</script>
</body>
</html>
