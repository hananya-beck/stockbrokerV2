name: Update fund data

on:
  schedule:
    # Daily at 05:00 UTC (after the TASE trading day settles).
    - cron: "0 5 * * *"
  workflow_dispatch: {}

concurrency:
  group: update-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch fund data
        run: python scripts/fetch_data.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/funds.json data/nav-history.json
          git diff --cached --quiet || git commit -m "Update fund data"
          git pull --rebase
          git push
